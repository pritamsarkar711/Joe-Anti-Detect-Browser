name: Build capability probe
on:
  push:
    branches: ['arena/**']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Confirm runner toolchain
        run: |
          echo "ACTIONS_OK"
          node --version
          java -version 2>&1 | head -2
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null | head -5
