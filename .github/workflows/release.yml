name: Build and publish binaries
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.0)'
        required: true
        default: 'v3.1.0'
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  web:
    name: Shared UI + core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run build:core
      - run: npm run build:android-ui
      - run: npm run build:assets
      - run: npm run build:site
      - run: npm run test:site
      - run: npm run test:java
      - run: npm run test:fingerprint
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: dist/, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        with: { name: core-bundle, path: apps/desktop/core.cjs, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        with: { name: android-assets, path: apps/android/assets/, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        with: { name: seo-site, path: dist-site/, retention-days: 7 }

  desktop:
    name: Windows EXE
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: core-bundle, path: apps/desktop }
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: apps/desktop/web-dist }
      - name: Install Electron toolchain
        run: npm install --prefix apps/desktop --no-audit --no-fund
      - name: Verify packaged inputs
        shell: bash
        run: |
          test -f apps/desktop/core.cjs
          test -f apps/desktop/web-dist/index.html
          node -e "const c=require('./apps/desktop/core.cjs'); console.log('core exports:', Object.keys(c).length)"
      - name: Build NSIS installer + portable EXE
        working-directory: apps/desktop
        run: npx electron-builder --win --x64 --publish never
      - name: List binaries
        shell: bash
        run: ls -lh apps/desktop/release/*.exe
      - uses: actions/upload-artifact@v4
        with: { name: desktop-binaries, path: apps/desktop/release/*.exe, retention-days: 7 }

  android:
    name: Android APK
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools"
          java -version
      - name: Install Android platform + build tools
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/tools/bin:$ANDROID_HOME/tools/bin:$PATH"
          if command -v sdkmanager > /dev/null; then
            yes | sdkmanager --licenses > /dev/null || true
            sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          ls "$ANDROID_HOME/build-tools"
      - uses: actions/download-artifact@v4
        with: { name: android-assets, path: apps/android/assets }
      - name: Compile, dex, package and sign the APK
        id: apkbuild
        run: |
          set +e
          chmod +x scripts/build-apk.sh
          bash -x scripts/build-apk.sh 2>&1 | tee apk-build.log
          exit ${PIPESTATUS[0]}
      - name: Publish APK build diagnostics
        if: failure() && steps.apkbuild.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "APK build failed on $(git rev-parse --short HEAD)"; echo '```text'; tail -160 apk-build.log; echo '```'; } > apk-issue.md
          gh issue create --title "APK build diagnostics $(git rev-parse --short HEAD)" --body-file apk-issue.md || true
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: apps/android/JoeBrowser.apk, retention-days: 7 }

  publish:
    name: GitHub Release
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: desktop-binaries, path: release-assets }
      - uses: actions/download-artifact@v4
        with: { name: android-apk, path: release-assets }
      - name: Checksums + manifest
        run: |
          cd release-assets
          ls -lh
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release with binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Joe Browser ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ## Joe Browser 2.0 — Windows + Android

            Download the Windows installer (`JoeBrowser-Setup-3.1.0.exe`), the portable
            build (`JoeBrowser-Portable-3.1.0.exe`) or the Android app (`JoeBrowser.apk`).
            `SHA256SUMS.txt` contains a checksum for every binary — verify it before running.

            **Highlights in 3.1**
            - The Android build compiles again: a Java lambda the APK toolchain cannot
              desugar is gone, and `test:java` now fails the build if one returns
            - Correct official Microsoft Edge mark in the browser picker, with the
              other engine marks re-verified against their sources
            - New identity: a "J" monogram on a squircle, from one geometry shared by
              the app, favicon, site, installer icon and Android adaptive icon
            - Extensions install through the app into its own folder, with zip-slip
              protection and a real integrity digest; no store round-trip required
            - Less text throughout: engine notes, helper sentences and provenance
              footers removed where they repeated what the control already said
            - Stability: relative bundle base so the installed build does not white-
              screen, an error boundary instead of a blank window, and per-frame
              fingerprint re-injection on Android with a real offline page
            - One scroll container, grouped navigation, Ctrl K palette, and a layout
              that holds from 360 px to 1440 px
            - New profiles open `browserscan.net` first; engines are bundled and never
              borrowed from browsers installed on the machine
            - Plans: 2 profiles free for life; premium adds Brave, Edge, Firefox,
              Joe Browser, bulk create, import and the advanced tools

            **Validation**: `tsc` clean; `npm test` 51/51, `test:fingerprint` 29/29,
            `test:devices` 75/75, `test:ui` 35/35, `test:site` 15/15, `test:java` 4/4.
            The Android APK, the NSIS installer and the portable EXE are built by this
            workflow from this tag. Details in `docs/VALIDATION.md`.

            **Honest scope**: JavaScript-visible surfaces are made coherent per profile.
            Joe Browser does not ship a patched Chromium or Firefox kernel, so TLS/JA4,
            HTTP/2 frame order, QUIC, font rasterisation, GPU driver behaviour and CDP
            side channels remain engine-controlled. It is not undetectable, and no
            third-party detector score is claimed. Intended for legitimate QA, testing,
            ad verification, privacy research and management of your own accounts.

            Built by GitHub Actions from tagged source in this repository.
            Source: MIT · docs and brand assets: CC BY-ND 4.0 · see NOTICE and TRADEMARK.md.
