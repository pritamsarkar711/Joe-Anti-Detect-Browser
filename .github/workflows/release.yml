name: Build and publish binaries
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.0)'
        required: true
        default: 'v3.2.0'
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  web:
    name: Shared UI + core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run build:core
      - run: npm run build:android-ui
      - run: npm run build:assets
      - run: npm run build:site
      - run: npm run test:site
      - run: npm run test:java
      - run: npm run test:fingerprint
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: dist/, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        with: { name: core-bundle, path: apps/desktop/core.cjs, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        with: { name: android-assets, path: apps/android/assets/, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        with: { name: seo-site, path: dist-site/, retention-days: 7 }

  desktop:
    name: Windows EXE
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: core-bundle, path: apps/desktop }
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: apps/desktop/web-dist }
      - name: Install Electron toolchain
        run: npm install --prefix apps/desktop --no-audit --no-fund
      - name: Verify packaged inputs
        shell: bash
        run: |
          test -f apps/desktop/core.cjs
          test -f apps/desktop/web-dist/index.html
          node -e "const c=require('./apps/desktop/core.cjs'); console.log('core exports:', Object.keys(c).length)"
      - name: Verify the package would contain every runtime module
        run: |
          npm run test:desktop
          npm run test:packaged
      - name: Build NSIS installer + portable EXE
        working-directory: apps/desktop
        run: npx electron-builder --win --x64 --publish never
      - name: Verify the built binaries contain the main process
        shell: bash
        working-directory: apps/desktop
        run: |
          # The EXE is only useful if it can start. v3.1.0 shipped without
          # extensions.cjs and every install died on launch, so assert against the
          # artifact electron-builder actually produced, not the source tree.
          # scripts/check-asar.mjs reads the archive header directly, so it needs
          # no dependencies and cannot fail for a reason unrelated to packaging.
          set -e
          ls -la release
          ls -la release/win-unpacked/resources || true
          node ../../scripts/check-asar.mjs release/win-unpacked/resources
      - name: List binaries
        shell: bash
        run: ls -lh apps/desktop/release/*.exe
      - uses: actions/upload-artifact@v4
        with: { name: desktop-binaries, path: apps/desktop/release/*.exe, retention-days: 7 }

  android:
    name: Android APK
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools"
          java -version
      - name: Install Android platform + build tools
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/tools/bin:$ANDROID_HOME/tools/bin:$PATH"
          if command -v sdkmanager > /dev/null; then
            yes | sdkmanager --licenses > /dev/null || true
            sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          ls "$ANDROID_HOME/build-tools"
      - uses: actions/download-artifact@v4
        with: { name: android-assets, path: apps/android/assets }
      - name: Compile, dex, package and sign the APK
        env:
          JOE_SIGNING_STORE_B64: ${{ secrets.JOE_SIGNING_STORE_B64 }}
          JOE_SIGNING_ALIAS: ${{ secrets.JOE_SIGNING_ALIAS }}
          JOE_STORE_PASSWORD: ${{ secrets.JOE_STORE_PASSWORD }}
          JOE_KEY_PASSWORD: ${{ secrets.JOE_KEY_PASSWORD }}
        run: bash scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: apps/android/JoeBrowser.apk, retention-days: 7 }

  publish:
    name: GitHub Release
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: desktop-binaries, path: release-assets }
      - uses: actions/download-artifact@v4
        with: { name: android-apk, path: release-assets }
      - name: Checksums + manifest
        run: |
          cd release-assets
          ls -lh
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release with binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Joe Browser ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ## Joe Browser 3.2.0 — Windows + Android

            Download the Windows installer (`JoeBrowser-Setup-3.2.0.exe`), the portable
            build (`JoeBrowser-Portable-3.2.0.exe`) or the Android app (`JoeBrowser.apk`).
            `SHA256SUMS.txt` contains a checksum for every binary — verify it before running.

            **Accounts are real in this release.** v3.1.1 had a sign-in screen that never
            contacted a server: any password was accepted, and typing the owner's email
            address in the email box granted the owner plan. That is fixed.

            **Highlights in 3.2.0**
            - Supabase authentication is implemented: sign-up, password login, password
              reset, refresh-token rotation and sign-out now make real requests. Without a
              configured project the app says so and stays on the local free tier
            - Plans and the administrator flag come from the server. The client reads
              `my_entitlement()`; there is no in-app upgrade button and no email-based
              administrator check anywhere
            - `supabase/migrations/0002_entitlements.sql` creates a personal workspace for
              every account, adds `entitlements`/`app_admins` (read-only to users), enforces
              the profile quota with a database trigger, and scopes primary keys per
              workspace. **Apply it to your project before signing in** — without it the
              app reports the missing function instead of guessing
            - Free-tier quota is enforced on every path that adds profiles, including CSV and
              workspace import, which previously bypassed it
            - A service-role key pasted into Settings is refused instead of stored
            - `npm run test:ui`, `npm run test:devices` and `npm run screenshots` now start
              their own server and exit cleanly; the device suite no longer overwrites the
              committed evidence report when a run fails
            - New tests: 21 for the account client, 12 for schema/secret invariants
            - Version metadata is consistent again (the desktop shell reported 3.1.0 while
              the package said 3.1.1)

            **Validation** (this environment: Debian, Node 22, no JDK/Android SDK/Electron/
            Postgres): `tsc` clean; `npm test` 87/87; `test:ui` 37/37; `test:devices` 75/75;
            `test:boot` pass (retry works when the entry script itself fails);
            `test:fingerprint` 29/29; `test:site` 15/15; `test:java` 4/4 (parse only);
            `test:icons` 8/8; `test:desktop` 10/10; `check:bridges` 6/6; `test:packaged` 4/4;
            `test:main` 14/14; `test:ui-desktop` 5/5. The migration is verified statically
            and is **not** executed here — it has no database. See `TEST_REPORT.md`,
            `SECURITY_AUDIT.md` and `PROJECT_AUDIT.md` for the full evidence and for every
            item that remains unverified.

            **Engine**: one bundled Chromium engine with four compatible browser
            identities (Joe Browser, Chrome, Edge, Brave). Firefox is **not** offered —
            no Gecko runtime is bundled, so presenting a Firefox identity would be a
            user-agent string on a Chromium engine. The picker says so.

            **Honest scope**: profile isolation, fingerprint coherence and history work as
            described for the surfaces the app controls. Joe Browser does not ship a patched
            Chromium or Firefox kernel, so TLS/JA4, HTTP/2 frame order, QUIC, font
            rasterisation, GPU driver behaviour and CDP side channels remain
            engine-controlled. It is **not undetectable**, no third-party detector score is
            claimed, and the app was not
            tested on physical Windows or Android devices by this build environment.

            Built by GitHub Actions from tagged source in this repository.
            Source: MIT · docs and brand assets: CC BY-ND 4.0 · see NOTICE and TRADEMARK.md.
