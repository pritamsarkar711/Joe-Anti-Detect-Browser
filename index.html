<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#D81B60" />
    <meta name="description" content="Joe Browser — isolated browser profiles with coherent fingerprints, per-profile proxies, built-in browser history and desktop/Android sync." />
    <title>Joe Browser — Profile Workspace</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <style>
      /* Boot shell: painted before the bundle parses, so a slow file:// load shows
         the product mark instead of an unexplained white screen. */
      html, body { margin: 0; height: 100%; background: #f6f7f9; }
      #root { min-height: 100%; }
      #joe-boot {
        position: fixed; inset: 0; display: grid; place-content: center; justify-items: center;
        gap: 14px; font: 500 13px/1.4 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
        color: #666c7a; background: #f6f7f9; transition: opacity .18s ease;
      }
      #joe-boot svg { width: 44px; height: 44px; }
      #joe-boot.hidden { display: none; }
      @media (prefers-color-scheme: dark) {
        html, body, #joe-boot { background: #0e1015; color: #9aa1b0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="joe-boot" role="status" aria-live="polite">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <rect width="48" height="48" rx="11.5" fill="#D81B60" />
        <path d="M29.4 12.5v15.4a8.4 8.4 0 0 1-16.8 0" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" />
      </svg>
      <span>Starting Joe Browser…</span>
      <a href="">Taking too long? Retry startup</a>
    </div>
    <noscript>Joe Browser needs JavaScript enabled.</noscript>
    <script type="module" src="/src/boot.tsx"></script>
  </body>
</html>
